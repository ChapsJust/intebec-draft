services:
  db:
    image: postgres:16-alpine
    container_name: generateur-contrat-db
    restart: always
    # Lié à la boucle locale seulement : l'app joint la base par le réseau Compose (`db:5432`),
    # la publication ne sert qu'aux outils locaux (`npm run db:studio`). Sans le `127.0.0.1`,
    # le port serait ouvert à tout le réseau, avec le mot de passe de développement ci-dessous.
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Applique les migrations Drizzle puis s'arrête
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: generateur-contrat-app
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # Serveur de développement SvelteKit
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: generateur-contrat-app
    container_name: generateur-contrat-app
    ports:
      - 5173:5173
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
      VITE_USE_POLLING: 'true'
      # IA, passerelle authentifiée du Mac Studio. Renseignée dans le .env local, elle prend le
      # pas sur OLLAMA_URL. Si le nom Tailscale ne se résout pas depuis le conteneur, voir la
      # section « IA » du README : un extra_hosts suffit, et préserve le certificat TLS.
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # IA en direct, mode de repli. `host.docker.internal` pointe vers la machine hôte : c'est
      # elle qui porte la connexion Tailscale. Remplacer par l'adresse Tailscale directe
      # (http://<nom-machine>:11434) pour joindre le serveur sans passer par l'hôte.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      # Accès. Reprises du .env local : sans elles le conteneur refuse toute requête.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_UTILISATEURS: ${AUTH_UTILISATEURS:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
