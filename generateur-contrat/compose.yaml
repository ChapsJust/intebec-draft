services:
  db:
    image: postgres:16-alpine
    container_name: generateur-contrat-db
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: generateur-contrat-app
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: generateur-contrat-app
    container_name: generateur-contrat-app
    ports:
      - 127.0.0.1:5173:5173
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
      VITE_USE_POLLING: 'true'
      PDF_ORIGIN: http://127.0.0.1:5173
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
